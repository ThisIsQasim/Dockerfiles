name: Docker Image CI - apcupsd

on:
  push:
    branches: [ "main" ]
    tags: ["v*", "apcupsd-*"]
    paths: [ "apcupsd/**", ".github/workflows/apcupsd.yaml", ".github/workflows/build-and-push.yaml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "apcupsd" ]
  workflow_dispatch:

jobs:

  build-and-push:
    uses: ./.github/workflows/build-and-push.yaml
    with:
      app: apcupsd
