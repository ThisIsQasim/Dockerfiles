name: Docker Image CI - Transmission

on:
  push:
    branches: [ "main" ]
    tags: ["v*", "transmission-*"]
    paths: [ "transmission/**", ".github/workflows/transmission.yaml", ".github/workflows/build-and-push.yaml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "transmission" ]
  workflow_dispatch:

jobs:

  build-and-push:
    uses: ./.github/workflows/build-and-push.yaml
    with:
      app: transmission
