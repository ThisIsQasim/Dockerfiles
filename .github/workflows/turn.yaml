name: Docker Image CI - turn

on:
  push:
    branches: [ "main" ]
    tags: ["v*", "turn-*"]
    paths: [ "turn/**", ".github/workflows/turn.yaml", ".github/workflows/build-and-push.yaml"]
  pull_request:
    branches: [ "main" ]
    paths: [ "turn" ]
  workflow_dispatch:

jobs:

  build-and-push:
    uses: ./.github/workflows/build-and-push.yaml
    with:
      app: turn
