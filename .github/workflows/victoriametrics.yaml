name: Docker Image CI - VictoriaMetrics

on:
  push:
    branches: [ master ]
    paths: [ "victoriametrics/**", ".github/workflows/victoriametrics.yaml" ]
  pull_request:
    branches: [ master ]
    paths: [ "victoriametrics/**" ]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          VictoriaMetrics version to build, e.g. v1.122.27. Leave empty to
          build every version clusternest/api's PrometheusCreate.version
          currently offers.
        required: false

jobs:

  determine-tags:
    name: Determine versions to build
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.set.outputs.tags }}
    steps:
    - id: set
      run: |
        if [ -n "${{ inputs.tag }}" ]; then
          echo 'tags=["${{ inputs.tag }}"]' >> "$GITHUB_OUTPUT"
        else
          # Keep in sync with clusternest/api's schemas.py PrometheusCreate.version
          # / models.py Prometheus.version.
          echo 'tags=["v1.122.27","v1.136.15","v1.148.1"]' >> "$GITHUB_OUTPUT"
        fi

  build:
    name: Build ${{ matrix.app }} ${{ matrix.tag }}
    needs: determine-tags
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.app }}-${{ matrix.tag }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJson(needs.determine-tags.outputs.tags) }}
        app: [vminsert, vmselect, vmstorage]

    steps:
    - name: Checkout Dockerfile
      uses: actions/checkout@v2

    - name: Shallow clone VictoriaMetrics ${{ matrix.tag }}
      # No submodule: there's no single upstream commit that works for
      # every version being built here (each matrix entry needs a
      # different tag), so this clones fresh per build instead. Plain
      # version tag, not "-cluster" - that suffix only exists for each
      # LTS line's .0 release; later patches were never given one (see
      # victoriametrics/Dockerfile for how this was confirmed), but the
      # plain tag still has the Go source needed to build from.
      run: |
        git clone --depth 1 --branch ${{ matrix.tag }} \
          https://github.com/VictoriaMetrics/VictoriaMetrics.git victoriametrics-checkout

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Read Go version from go.mod
      id: go-version
      run: echo "version=$(grep -m1 '^go ' victoriametrics-checkout/go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v2
      with:
        context: victoriametrics-checkout
        file: victoriametrics/Dockerfile
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.tag }}
        cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.tag }}
        pull: true
        push: ${{ github.event_name != 'pull_request' }}
        build-args: |
          GO_VERSION=${{ steps.go-version.outputs.version }}
          APP_NAME=${{ matrix.app }}
          VERSION=${{ matrix.tag }}
        # -cluster suffix kept on the pushed image tag even though nothing
        # here is Docker-Hub-tag-format-constrained anymore, purely so
        # clusternest/api's controllers/victoriametrics.py (which computes
        # f"v{version}-cluster") needs no change to match.
        tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ matrix.tag }}-cluster
