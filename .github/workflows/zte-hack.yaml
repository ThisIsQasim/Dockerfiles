name: Docker Image CI - zte-hack

on:
  push:
    branches: [ "main" ]
    tags: ["v*", "zte-hack-*"]
    paths: [ "zte-hack/**", ".github/workflows/zte-hack.yaml", ".github/workflows/build-and-push.yaml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "zte-hack" ]
  workflow_dispatch:

jobs:

  build-and-push:
    uses: ./.github/workflows/build-and-push.yaml
    with:
      app: zte-hack
