name: Docker Image CI - tabula-py

on:
  push:
    branches: [ master ]
    tags: ["v*", "tabula-py-*"]
    paths: [ "tabula-py/**", ".github/workflows/tabula-py.yaml", ".github/workflows/build-and-push.yaml" ]
  pull_request:
    branches: [ master ]
    paths: [ "tabula-py" ]
  workflow_dispatch:

jobs:

  build-and-push:
    uses: ./.github/workflows/build-and-push.yaml
    with:
      app: tabula-py
