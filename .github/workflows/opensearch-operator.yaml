name: Docker Image CI - OpenSearch Operator

on:
  push:
    branches: [ master ]
    paths: [ "opensearch-operator", ".github/workflows/opensearch-operator.yaml" ]
  pull_request:
    branches: [ master ]
    paths: [ "opensearch-operator" ]
  workflow_dispatch: {}

jobs:

  build:
    name: Build Operator Image
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true

    - name: Set operator commit tag
      id: operator-ref
      run: echo "sha=$(git -C opensearch-operator rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Copy LICENSE into the build context
      # The Dockerfile does `COPY LICENSE /licenses/LICENSE`, but LICENSE
      # only lives at the submodule root, one level above the build
      # context - upstream's own Makefile docker-build target copies it in
      # the same way before invoking `docker build` directly.
      run: cp opensearch-operator/LICENSE opensearch-operator/opensearch-operator/LICENSE

    - name: Lowercase repo owner
      id: repo-owner
      run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Login to GitHub Container Registry
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: opensearch-operator/opensearch-operator
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max
        pull: true
        push: ${{ github.event_name != 'pull_request' }}
        tags: ghcr.io/${{ steps.repo-owner.outputs.owner }}/opensearch-operator:${{ steps.operator-ref.outputs.sha }}
